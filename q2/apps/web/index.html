<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Relative: this is served from a subpath, not the domain root. -->
    <link rel="icon" href="./favicon.ico" />
    <title>Quake II — NetQuake</title>
    <style>
      /* Way back to the rest of the site. "../" is the parent of /q2/, so it
         holds wherever the site is mounted. Hidden while the pointer is locked
         so it never sits over the game during play. */
      .back-to-site {
        position: fixed;
        top: 10px;
        left: 12px;
        z-index: 9999;
        font: 12px/1 system-ui, sans-serif;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #cfcfcf;
        background: rgba(0, 0, 0, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 3px;
        padding: 6px 10px;
        text-decoration: none;
        opacity: 0.55;
        transition: opacity 0.15s ease;
      }
      .back-to-site:hover { opacity: 1; }
      body.pointer-locked .back-to-site { display: none; }
      /* Top right, opposite the pak control. Stays visible under pointer
         lock on purpose: it cannot be clicked then, but it is the only
         indication of whether the mic is open, and M is the real control. */
      .voice-control {
        position: fixed;
        top: 10px;
        right: 10px;
        z-index: 9999;
        font: 12px/1 system-ui, sans-serif;
        color: #cfcfcf;
      }
      .voice-control button {
        font: inherit;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: inherit;
        background: rgba(0, 0, 0, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 3px;
        padding: 6px 10px;
        cursor: pointer;
      }
      .voice-row { display: flex; gap: 6px; justify-content: flex-end; }
      /* Small on purpose: foyer scales the encoding to the number of players,
         so a full server sends thumbnails and showing them large would only
         magnify that. Never interactive -- a click here was meant for the game. */
      .voice-tiles {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        justify-content: flex-end;
        margin-top: 6px;
        max-width: 330px;
        pointer-events: none;
      }
      .voice-tiles video {
        width: 104px;
        height: 78px;
        object-fit: cover;
        background: #111;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 2px;
      }
      .voice-control button.muted { opacity: 0.6; }
      .voice-control button.talking {
        color: #7ad17a;
        border-color: rgba(122, 209, 122, 0.6);
        opacity: 1;
      }
      /* Sits beside the back link, same visual weight. */
      .pak-upload {
        position: fixed;
        top: 10px;
        left: 140px;
        z-index: 9999;
        font: 12px/1 system-ui, sans-serif;
        color: #cfcfcf;
        opacity: 0.55;
        transition: opacity 0.15s ease;
      }
      .pak-upload:hover { opacity: 1; }
      .pak-upload button {
        font: inherit;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: inherit;
        background: rgba(0, 0, 0, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 3px;
        padding: 6px 10px;
        cursor: pointer;
      }
      body.pointer-locked .pak-upload { display: none; }
    </style>
  </head>
  <body>
    <a class="back-to-site" href="../">&larr; NetQuake</a>
    <div id="app"></div>
    <script>
      // The engine grabs the pointer to look around; the link would otherwise
      // hang over the view for the whole match.
      document.addEventListener("pointerlockchange", () => {
        document.body.classList.toggle("pointer-locked", !!document.pointerLockElement);
      });
    </script>
    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
