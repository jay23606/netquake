name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:sim
      - run: npx vite build
      # Quake 2 builds after Quake 1, whose build empties dist/app, and emits
      # into dist/app/q2 so one Pages deploy serves both engines.
      - run: npm ci
        working-directory: q2
      - run: npm run build
        working-directory: q2
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/app

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
